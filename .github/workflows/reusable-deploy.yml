name: Reusable deploy to VPS

on:
  workflow_call:
    inputs:
      project_name:
        description: "Nom du projet, doit matcher 'name' dans group_vars/all.yml"
        required: true
        type: string
      project_type:
        description: "node | python | rust | springboot | static"
        required: true
        type: string
      remote_path:
        description: "Chemin du projet sur le VPS, ex: /home/lucas/apps/mon-projet"
        required: true
        type: string
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # --- Build, selon la stack ---

      - name: Setup Node
        if: inputs.project_type == 'node' || inputs.project_type == 'static'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Node/Next.js (mode serveur)
        if: inputs.project_type == 'node'
        run: |
          npm ci
          npm run build

      - name: Build Next.js (export statique)
        if: inputs.project_type == 'static'
        run: |
          npm ci
          npm run build

      - name: Setup Rust
        if: inputs.project_type == 'rust'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build Rust
        if: inputs.project_type == 'rust'
        run: cargo build --release

      - name: Setup Java
        if: inputs.project_type == 'springboot'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build Spring Boot
        if: inputs.project_type == 'springboot'
        run: ./mvnw clean package -DskipTests=false

      # Python : pas de build à proprement parler - le venv et les
      # dépendances sont créés/installés côté VPS plus bas (voir les étapes
      # "Créer le venv" et "Installer les dépendances Python").

      # --- Déploiement ---

      - name: Ajouter la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ajouter le VPS aux hôtes connus
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Synchroniser un site statique (seul le dossier "out" part sur le VPS)
        if: inputs.project_type == 'static'
        run: |
          rsync -avz --delete \
            out/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ inputs.remote_path }}/

      - name: Synchroniser un projet avec process (tout le repo, sans le superflu)
        if: inputs.project_type != 'static'
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ inputs.remote_path }}/

      - name: Créer le venv Python côté VPS s'il n'existe pas encore (premier déploiement)
        if: inputs.project_type == 'python'
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "test -d ${{ inputs.remote_path }}/venv || python3 -m venv ${{ inputs.remote_path }}/venv"

      - name: S'assurer que pip est bien présent dans le venv (Debian/Ubuntu l'omettent par défaut)
        if: inputs.project_type == 'python'
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "${{ inputs.remote_path }}/venv/bin/python3 -m ensurepip --upgrade"

      - name: Installer les dépendances Python côté VPS (si applicable)
        if: inputs.project_type == 'python'
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "${{ inputs.remote_path }}/venv/bin/pip install -r ${{ inputs.remote_path }}/requirements.txt"

      - name: Installer les dépendances Node côté VPS (node_modules est exclu du rsync)
        if: inputs.project_type == 'node'
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ inputs.remote_path }} && npm ci --omit=dev"

      - name: Redémarrer le service (sauf static, qui n'a pas de process)
        if: inputs.project_type != 'static'
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo systemctl restart ${{ inputs.project_name }}"

      - name: Vérifier que le service tourne bien (sauf static)
        if: inputs.project_type != 'static'
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "systemctl is-active --quiet ${{ inputs.project_name }}"